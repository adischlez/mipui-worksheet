<title>כיתה ה׳ · בית ספר אשכולות</title>
<style>
*{box-sizing:border-box}
:root{--navy:#203b5c;--line:#c9d6e6;--muted:#4a5d75}
body{margin:0;background:#F4F7FF;color:var(--navy);font:18px/1.5 Arial,sans-serif;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
main{max-width:600px;margin:auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px;min-width:0}
.titlerow h1{margin:0;min-width:0}
.back{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:36px;font:700 15px Arial,sans-serif;padding:4px 12px;border-radius:18px;background:#fff;color:var(--navy);border:1.5px solid #b9cadc;box-shadow:0 2px 0 #b9cadc;text-decoration:none;white-space:nowrap}
.back:active{transform:translateY(2px);box-shadow:none}
.brand{font-weight:700;min-width:0}
h1{font-size:28px;margin:4px 0 6px;line-height:1.25}
p{margin:6px 0 12px}
.muted{color:var(--muted);font-size:17px}
button,a{touch-action:manipulation}
button,a.subject,a.item,a.pill{font:700 18px Arial,sans-serif;cursor:pointer;min-height:52px;border-radius:16px}
button:focus-visible,a:focus-visible{outline:3px solid #c17017;outline-offset:3px}
.subject,.item{display:block;text-align:right;width:100%;background:#fff;color:inherit;text-decoration:none;border:2px solid var(--line);border-right:8px solid var(--c,#1F8A8A);padding:12px 15px;margin:9px 0;box-shadow:0 4px 0 var(--line)}
.subject strong,.item strong{display:block;font-size:21px;color:var(--ct,#17706F);line-height:1.3;overflow-wrap:anywhere}
.subject span,.item span{display:block;font-size:17px;font-weight:400;color:var(--navy);margin-top:2px;overflow-wrap:anywhere}
.subject:active,.item:active,.pill:active{transform:translateY(3px);box-shadow:0 1px 0 #0f2238}
.subject[data-id=english],.item[data-kind=english]{--c:#1F8A8A;--ct:#17706F}
.subject[data-id=geography],.item[data-kind=geography]{--c:#1F7FB8;--ct:#17608c}
.pill.extra{display:flex;width:fit-content;max-width:100%;white-space:normal;margin:-2px 22px 12px 0;font-weight:400}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:38px;font-size:15px;padding:4px 12px;border-radius:19px;background:#fff;color:var(--navy);border:1.5px solid #b9cadc;box-shadow:0 2px 0 #b9cadc;text-decoration:none;white-space:nowrap}
.tiny{font-size:16px;color:var(--muted)}
.footer{margin-top:16px;font-size:16px;color:var(--muted)}
[hidden]{display:none!important}
@media(max-width:360px){
  h1{font-size:25px}
  .subject,.item{padding:10px 13px;margin:7px 0}
  .subject strong,.item strong{font-size:19px}
}
</style>
</head>
<body>
<main>
<section id="subjects">
<h1>כיתה ה׳ · בית ספר אשכולות</h1>
<p class="muted">בוחרים מקצוע, ואחר כך תרגול.</p>
<a class="subject" data-id="english" href="#english"><strong>אנגלית</strong><span>ההכתבה הבאה, והכתבות קודמות. ספר <bdi dir="ltr" lang="en">Fantastic Five</bdi>.</span></a>
<a class="subject" data-id="geography" href="#geography"><strong>גאוגרפיה</strong><span>מסע בעולם — מושגים, גלובוס ומפה.</span></a>
<p class="footer">בלי שמות, בלי שמירת תשובות ובלי מעקב.</p>
</section>

<section id="items" hidden>
<div class="titlerow"><h1 id="itemtitle"></h1><a class="back" id="back" href="#">→ חזרה</a></div>
<p class="muted" id="itemlead"></p>
<div id="itemlist"></div>
<p class="footer">בלי שמות, בלי שמירת תשובות ובלי מעקב.</p>
</section>
</main>
<script>
const SUBJECTS={
  english:{
    title:'אנגלית',
    lead:'במה מתרגלים היום?',
    items:[
      {kind:'english',href:'english.html?v=fb1&unit=ready',title:'ההכתבה הבאה - <bdi dir="ltr" lang="en">Getting Ready</bdi>',sub:'רק המילים של ההכתבה הבאה · עמ׳ 29 בספר <bdi dir="ltr" lang="en">Fantastic Five</bdi>',
       extra:{href:'pages/english-ready-practice.pdf?v=2026-11-20c',title:'📄 דפי תרגול להדפסה'}},
      {kind:'english',href:'english.html?v=fb1&unit=past',title:'הכתבות קודמות',sub:'כל המילים מכל ההכתבות שכבר היו, יחד',
       extra:{href:'pages/english-p34-practice.pdf?v=2026-11-20c',title:'📄 דפי תרגול להדפסה'}}
    ]
  },
  geography:{
    title:'גאוגרפיה',
    lead:'לומדה אחת, עם כמה תרגולים בפנים.',
    items:[
      {kind:'geography',href:'geography/',title:'מסע בעולם',sub:'מושגים בגאוגרפיה: מסע מושגים, גלובוס מול מפה, בלשי המפה, ומוצאים במפה.'}
    ]
  }
};

function showSubjects(){
  if(location.hash && location.hash!=='#' && location.hash!==''){
    history.replaceState(null,'',location.pathname+location.search);
  }
  document.getElementById('items').hidden=true;
  document.getElementById('subjects').hidden=false;
  document.title='כיתה ה׳ · בית ספר אשכולות';
  window.scrollTo(0,0);
}

function showSubject(id){
  const s=SUBJECTS[id];
  if(!s){showSubjects();return;}
  document.getElementById('subjects').hidden=true;
  document.getElementById('items').hidden=false;
  document.getElementById('itemtitle').textContent=s.title;
  document.getElementById('itemlead').textContent=s.lead;
  const box=document.getElementById('itemlist');
  box.textContent='';
  s.items.forEach(it=>{
    const a=document.createElement('a');
    a.className='item';
    a.dataset.kind=it.kind;
    a.href=it.href;
    if(it.pdf){a.target='_blank';a.rel='noopener';}
    const strong=document.createElement('strong');
    strong.innerHTML=it.title;
    const span=document.createElement('span');
    span.innerHTML=it.sub;
    a.append(strong,span);
    box.append(a);
    if(it.extra){
      const x=document.createElement('a');
      x.className='pill extra';x.href=it.extra.href;x.target='_blank';x.rel='noopener';
      x.textContent=it.extra.title;
      box.append(x);
    }
  });
  document.title=s.title+' · בית ספר אשכולות';
  window.scrollTo(0,0);
}

function route(){
  const id=(location.hash||'').replace(/^#/,'').replace(/\/$/,'');
  if(id&&SUBJECTS[id])showSubject(id);
  else {
    document.getElementById('items').hidden=true;
    document.getElementById('subjects').hidden=false;
    document.title='כיתה ה׳ · בית ספר אשכולות';
  }
}

document.getElementById('back').addEventListener('click',function(e){
  e.preventDefault();
  if(location.hash) history.pushState(null,'',location.pathname+location.search);
  showSubjects();
});
window.addEventListener('hashchange',route);
route();
</script>
</body></html>
